<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑器 · 水务总览驾驶舱 · ScreenCraft</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* 画布滚动：flex + margin auto，放大后可滚动、缩小时居中 */
  .ed-canvas-wrap { display: flex; }
  .ed-canvas { margin: auto; }

  /* 画布内组件内容 */
  .cv-title { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; letter-spacing: 8px;
    background: linear-gradient(90deg, #35E0FF, #2F7FF7 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cv-weather { width: 100%; height: 100%; display: flex; align-items: center; gap: 12px; padding: 0 16px; color: var(--acc);
    background: rgba(22,41,78,.55); border: 1px solid rgba(53,114,200,.35); border-radius: var(--r-lg); }
  .cv-weather b { display: block; font-size: 14px; color: var(--t1); font-weight: 600; }
  .cv-weather span { font-size: 11px; color: var(--t2); }

  .cv-panel-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--t2); padding: 8px 10px 4px; letter-spacing: .04em; }
  .cv-panel-head b { color: var(--t1); font-weight: 600; font-size: 13px; }

  .kpi-grid { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; }
  .kpi-cell { background: rgba(22,41,78,.55); border: 1px solid rgba(53,114,200,.35); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .kpi-cell .k-label { font-size: 12px; color: var(--t2); }
  .kpi-cell .k-val { font-family: var(--font-num); font-size: 26px; color: var(--t1); line-height: 1.1; }
  .kpi-cell .k-val small { font-size: 11px; color: var(--t2); margin-left: 4px; font-family: var(--font-body); }
  .kpi-cell .k-trend { font-size: 11px; display: flex; align-items: center; gap: 3px; font-family: var(--font-num); }
  .k-trend.up { color: var(--ok); } .k-trend.down { color: var(--err); }

  .cv-table { width: calc(100% - 20px); margin: 0 10px; border-collapse: collapse; font-size: 12px; }
  .cv-table th { text-align: left; padding: 6px 8px; color: var(--t2); font-weight: 500; background: rgba(47,127,247,.12); border-bottom: 1px solid rgba(53,114,200,.35); }
  .cv-table td { padding: 6px 8px; border-bottom: 1px solid rgba(30,58,102,.5); color: var(--t1); }
  .cv-table td.num { color: var(--acc); }

  .cv-video { width: 100%; height: 100%; border-radius: var(--r-md); background:
    repeating-linear-gradient(0deg, rgba(53,224,255,.03) 0 2px, transparent 2px 6px),
    linear-gradient(160deg, #0A1428, #101F3E); border: 1px solid rgba(53,114,200,.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--t2); position: relative; }
  .cv-video .play { width: 52px; height: 52px; border-radius: 50%; border: 2px solid rgba(53,224,255,.6); display: grid; place-items: center; color: var(--acc); }
  .cv-video .live { position: absolute; top: 10px; left: 12px; display: flex; align-items: center; gap: 5px; font-size: 11px; color: #fff; }
  .cv-video .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--err); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .cv-text { width: 100%; height: 100%; padding: 10px 12px; font-size: 12.5px; color: var(--t2); line-height: 1.9; background: rgba(22,41,78,.4); border: 1px solid rgba(53,114,200,.3); border-radius: var(--r-md); overflow: hidden; }
  .cv-dropdown { width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: var(--r-md); font-size: 13px; color: var(--t1); }
  .cv-dropdown svg { color: var(--t2); }
  .cv-button { width: 100%; height: 100%; display: grid; place-items: center; background: linear-gradient(135deg, var(--pri), #1E6AE0); border-radius: var(--r-md); color: #fff; font-size: 15px; letter-spacing: 6px; font-weight: 500; box-shadow: 0 4px 14px rgba(47,127,247,.4); }
  .cv-placeholder { width: 100%; height: 100%; border: 1px dashed rgba(53,224,255,.5); border-radius: var(--r-md); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--acc); font-size: 12px; background: rgba(53,224,255,.04); }

  /* 右侧面板补充 */
  .p-sec .seg { width: 100%; }
  .p-sec .seg .seg-item { flex: 1; text-align: center; }
  .data-src { margin-top: 12px; }
  .event-card { border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; background: var(--panel2); margin-bottom: 10px; }
  .event-card .ev-row { display: flex; gap: 8px; font-size: 12px; margin-bottom: 6px; color: var(--t1); }
  .event-card .ev-row b { color: var(--t2); font-weight: 400; flex: none; width: 56px; }
  .border-dots { display: flex; gap: 8px; }
  .border-dots .color-dot.sel { outline: 2px solid var(--pri); outline-offset: 2px; }
  .pos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pos-grid .f-row { margin-bottom: 0; }

  /* 快捷键表 */
  .kbd-table { width: 100%; font-size: 13px; border-collapse: collapse; }
  .kbd-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); color: var(--t2); }
  .kbd-table td:last-child { text-align: right; color: var(--t1); }
  kbd { display: inline-block; padding: 2px 7px; background: var(--panel2); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; font-family: var(--font-num); font-size: 11.5px; color: var(--t1); margin-left: 4px; }

  .lib-cat svg { opacity: .9; }
  .ed-screen-name { font-size: 13.5px; font-weight: 600; color: var(--t1); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ai-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
  .ai-chips button { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--t2); transition: all .15s; }
  .ai-chips button:hover { color: var(--pri); border-color: var(--pri); background: var(--pri-bg); }
</style>
</head>
<body>
<div class="ed-shell">

  <!-- 顶部工具栏 -->
  <div class="ed-top">
    <a class="ed-back" href="screens.html"><i data-icon="chevron-left" data-size="16"></i>返回</a>
    <div class="ed-sep"></div>
    <span class="ed-screen-name">水务总览驾驶舱</span>
    <span class="tag tag-warn" id="saveTag" style="margin-left:8px">未保存</span>
    <div class="ed-sep"></div>
    <button class="ed-tool" id="btnUndo" title="撤销 (Ctrl+Z)"><i data-icon="rotate-ccw" data-size="16"></i></button>
    <button class="ed-tool" id="btnRedo" title="重做 (Ctrl+Shift+Z)"><i data-icon="rotate-cw" data-size="16"></i></button>
    <div class="ed-sep"></div>
    <button class="ed-tool" id="btnZoomOut" title="缩小"><i data-icon="zoom-out" data-size="16"></i></button>
    <span class="ed-zoom" id="zoomVal">100%</span>
    <button class="ed-tool" id="btnZoomIn" title="放大"><i data-icon="zoom-in" data-size="16"></i></button>
    <div class="ed-sep"></div>
    <button class="ed-tool" id="btnGrid" title="网格 (原型演示)"><i data-icon="grid" data-size="16"></i></button>

    <div class="ed-top-right">
      <button class="btn btn-ghost btn-sm" id="btnKeys"><i data-icon="book-open" data-size="14"></i>快捷键</button>
      <button class="btn btn-sm" id="btnSave"><i data-icon="save" data-size="14"></i>保存</button>
      <button class="btn btn-sm" id="btnTpl"><i data-icon="layout-template" data-size="14"></i>保存为模板</button>
      <button class="btn btn-pri btn-sm" id="btnPreview"><i data-icon="eye" data-size="14"></i>预览</button>
      <div class="dropdown">
        <button class="btn btn-ghost btn-sm" id="btnMore"><i data-icon="more-horizontal" data-size="15"></i></button>
        <div class="dropdown-menu" id="moreMenu">
          <a href="display.html"><i data-icon="play" data-size="14"></i>进入展示页</a>
          <button id="btnExport"><i data-icon="download" data-size="14"></i>导出配置 JSON</button>
          <div class="divider"></div>
          <button class="danger" id="btnClear"><i data-icon="trash-2" data-size="14"></i>清空画布</button>
        </div>
      </div>
    </div>
  </div>

  <div class="ed-body">

    <!-- 左侧：页面 / 组件库 -->
    <div class="ed-left">
      <div class="tabs">
        <button class="tab" data-left="pages">页面</button>
        <button class="tab active" data-left="lib">组件</button>
      </div>

      <div class="ed-left-body" id="panePages" style="display:none">
        <div id="pageTree"></div>
        <button class="btn btn-ghost btn-sm" id="btnAddPage" style="width:100%;margin-top:10px"><i data-icon="folder-plus" data-size="14"></i>新建页面</button>
      </div>

      <div class="ed-left-body" id="paneLib">
        <div class="input-wrap lib-search">
          <i data-icon="search" data-size="14"></i>
          <input class="input input-sm" id="libKw" placeholder="搜索组件">
        </div>
        <div class="lib-cats" id="libCats"></div>
        <div class="lib-grid" id="libGrid"></div>
      </div>
    </div>

    <!-- 中间画布 -->
    <div class="ed-canvas-wrap" id="canvasWrap">
      <div class="ed-canvas" id="canvas"></div>
    </div>

    <!-- 右侧设置面板 -->
    <div class="ed-right">
      <div class="ed-right-body" id="rightPanel"></div>
    </div>
  </div>
</div>

<!-- AI 客服悬浮 -->
<div class="ai-fab" id="aiFab" title="AI 客服"><i data-icon="bot" data-size="22"></i></div>
<div class="ai-drawer" id="aiDrawer">
  <div class="ai-head"><span class="dot"></span>AI 客服<span class="muted" style="font-weight:400;font-size:12px;margin-left:2px">基于知识库问答</span>
    <button class="x" id="aiClose" style="margin-left:auto;color:var(--t2)"><i data-icon="x" data-size="15"></i></button>
  </div>
  <div class="ai-msgs" id="aiMsgs">
    <div class="ai-msg bot">你好，我是 ScreenCraft 智能客服。关于组件使用、数据绑定、事件联动的问题都可以问我。</div>
  </div>
  <div class="ai-chips">
    <button data-q="如何添加图表组件？">如何添加图表？</button>
    <button data-q="下拉框如何联动其他组件？">下拉框联动</button>
    <button data-q="如何保存为模板？">保存模板</button>
  </div>
  <div class="ai-input">
    <input class="input input-sm" id="aiInput" placeholder="输入问题，Enter 发送">
    <button class="btn btn-pri btn-sm" id="aiSend"><i data-icon="send" data-size="14"></i></button>
  </div>
</div>

<!-- 快捷键弹窗 -->
<div class="modal-wrap" id="mShortcuts">
  <div class="modal">
    <div class="modal-head"><span>快捷键说明</span><button class="x" data-close="#mShortcuts"><i data-icon="x" data-size="16"></i></button></div>
    <div class="modal-body">
      <table class="kbd-table">
        <tr><td>保存大屏</td><td><kbd>Ctrl</kbd><kbd>S</kbd></td></tr>
        <tr><td>撤销 / 重做</td><td><kbd>Ctrl</kbd><kbd>Z</kbd> / <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>Z</kbd></td></tr>
        <tr><td>复制 / 粘贴组件</td><td><kbd>Ctrl</kbd><kbd>C</kbd> / <kbd>Ctrl</kbd><kbd>V</kbd></td></tr>
        <tr><td>删除选中组件</td><td><kbd>Delete</kbd></td></tr>
        <tr><td>组合 / 取消组合</td><td><kbd>Ctrl</kbd><kbd>G</kbd> / <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>G</kbd></td></tr>
        <tr><td>微调位置（Shift ×10）</td><td><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></td></tr>
        <tr><td>取消选中 / 退出组内模式</td><td><kbd>Esc</kbd></td></tr>
      </table>
    </div>
  </div>
</div>

<!-- 保存为模板弹窗 -->
<div class="modal-wrap" id="mTemplate">
  <div class="modal">
    <div class="modal-head"><span>保存为模板</span><button class="x" data-close="#mTemplate"><i data-icon="x" data-size="16"></i></button></div>
    <div class="modal-body">
      <div class="form-row"><span class="form-label">模板名称</span><div class="form-ctrl"><input class="input" id="tplName" placeholder="例如：水务运营通用版" maxlength="20"></div></div>
      <div class="form-row"><span class="form-label">模板分类</span><div class="form-ctrl">
        <select class="select" id="tplCat"><option>通用</option><option>工业</option><option>政务</option><option>医疗</option><option>交通</option><option>能源</option></select>
      </div></div>
      <p class="form-tip" style="margin-left:108px">保存为个人模板；管理员可在模板库中将其提升为公共模板。</p>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close="#mTemplate">取消</button>
      <button class="btn btn-pri" id="tplSave">保存模板</button>
    </div>
  </div>
</div>

<div class="toast-wrap"></div>
<script src="icons.js"></script>
<script src="mock.js"></script>
<script src="api.js"></script>
<script src="charts.js"></script>
<script>
  /* ================= 状态 ================= */
  var state = { zoom: 1, selId: null, leftTab: 'lib', libCat: 'charts', libKw: '', rightTab: 'style', dataSrc: 'static' };
  var canvasEl = document.getElementById('canvas');
  var seq = 100;
  var CHART_TYPES = ['line', 'bar', 'pie', 'combo', 'funnel', 'radar', 'gauge', 'kpi', 'table'];

  var KPIS = [
    { label: '累计供水', val: '12,842', unit: 'm³', trend: '+4.2%', up: true },
    { label: '管网压力', val: '0.38', unit: 'MPa', trend: '-1.1%', up: false },
    { label: '设备在线率', val: '96.4', unit: '%', trend: '+0.8%', up: true },
    { label: '今日告警', val: '7', unit: '条', trend: '-22.0%', up: false }
  ];

  function markDirty() {
    var t = document.getElementById('saveTag');
    t.className = 'tag tag-warn'; t.textContent = '未保存';
  }

  /* ================= 组件内容渲染 ================= */
  function compContent(c) {
    var w = c.w, h = c.h;
    function head(t) { return '<div class="cv-panel-head"><b>' + t + '</b><i data-icon="more-horizontal" data-size="13"></i></div>'; }
    switch (c.type) {
      case 'title': return '<div class="cv-title">' + c.name + '</div>';
      case 'weather': return '<div class="cv-weather"><i data-icon="cloud-sun" data-size="26"></i><div><b>杭州市 · 多云 29°C</b><span>湿度 62% · 空气质量 优 · 10:00 更新</span></div></div>';
      case 'kpi': return '<div class="kpi-grid">' + KPIS.map(function (k) {
        return '<div class="kpi-cell"><span class="k-label">' + k.label + '</span><span class="k-val">' + k.val + '<small>' + k.unit + '</small></span>' +
          '<span class="k-trend ' + (k.up ? 'up' : 'down') + '"><i data-icon="arrow-' + (k.up ? 'up' : 'down') + '" data-size="11"></i>' + k.trend + '</span></div>';
      }).join('') + '</div>';
      case 'line': return head('管网压力趋势') + '<div style="padding:0 10px">' + cLine([28, 34, 31, 40, 38, 47, 44, 52, 49, 58, 54, 62], { w: Math.max(w - 24, 80), h: Math.max(h - 46, 40) }) + '</div>';
      case 'bar': return head('各站点供水量') + '<div style="padding:0 10px">' + cBars([42, 58, 50, 72, 64, 80], { w: Math.max(w - 24, 80), h: Math.max(h - 46, 40), data2: [30, 44, 38, 55, 48, 62] }) + '</div>';
      case 'combo': return head('供水量与能耗对比') + '<div style="padding:0 10px">' + cBars([52, 64, 58, 76, 68, 84], { w: Math.max(w - 24, 80), h: Math.max(h - 46, 40), data2: [36, 48, 42, 58, 50, 66] }) + '</div>';
      case 'pie': var size = Math.max(Math.min(w, h) - 60, 60);
        return head('供水结构') + '<div style="display:flex;justify-content:center">' + cDonut([{ value: 46 }, { value: 28 }, { value: 16 }, { value: 10 }], { size: size, thick: size / 9, center: '2.4万', sub: '日供水 m³' }) + '</div>';
      case 'gauge': return head('设备在线率') + '<div style="display:flex;justify-content:center;padding-top:6px">' + cGauge(96, { w: Math.max(w - 60, 90), h: Math.max(h - 70, 60), fs: 24 }) + '</div>';
      case 'radar': return head('水质综合评分') + '<div style="display:flex;justify-content:center">' + cRadar([0.86, 0.72, 0.9, 0.64, 0.78, 0.82], { size: Math.max(Math.min(w, h - 36) - 16, 70) }) + '</div>';
      case 'funnel': return head('工单处理漏斗') + '<div style="display:flex;justify-content:center">' + cFunnel([{ name: '受理 128', value: 100 }, { name: '派单 102', value: 80 }, { name: '处理 86', value: 64 }, { name: '完结 79', value: 50 }], { w: Math.max(w - 40, 120), h: Math.max(h - 46, 60) }) + '</div>';
      case 'table':
        var rows = DB.apiDetail.testResult;
        return head('实时监测数据') + '<table class="cv-table"><tr>' + rows.columns.map(function (t) { return '<th>' + t + '</th>'; }).join('') + '</tr>' +
          rows.rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td class="num">' + r[1] + '</td><td class="num">' + r[2] + '</td></tr>'; }).join('') + '</table>';
      case 'dropdown': return '<div class="cv-dropdown"><span>区域：全部</span><i data-icon="chevron-down" data-size="14"></i></div>';
      case 'button': return '<div class="cv-button">查 询</div>';
      case 'text': return '<div class="cv-text">备注：本驾驶舱数据每 5 分钟自动刷新一次。<br>管网压力低于 0.28 MPa 时触发低压告警，请调度中心及时关注。<br>如需接入新站点，请在「API 配置」中添加。</div>';
      case 'video': return '<div class="cv-video"><span class="live"><i></i>LIVE · 滨江泵站</span><span class="play"><i data-icon="play" data-size="20"></i></span><span style="font-size:12px">' + c.name + '</span></div>';
      default: return '<div class="cv-placeholder"><i data-icon="layout-grid" data-size="22"></i><span>' + c.name + ' · 组件占位</span></div>';
    }
  }

  function renderCanvas() {
    canvasEl.innerHTML = DB.canvas.map(function (c) {
      return '<div class="cv-comp' + (c.id === state.selId ? ' selected' : '') + '" data-id="' + c.id + '" style="left:' + c.x + 'px;top:' + c.y + 'px;width:' + c.w + 'px;height:' + c.h + 'px">' +
        '<span class="cv-label">' + c.name + '</span>' + compContent(c) +
        '<span class="cv-handle tl"></span><span class="cv-handle tr"></span><span class="cv-handle bl"></span><span class="cv-handle br"></span></div>';
    }).join('');
    mountIcons(canvasEl);
  }

  function findComp(id) { return DB.canvas.filter(function (c) { return c.id === id; })[0]; }

  function select(id) {
    state.selId = id;
    canvasEl.querySelectorAll('.cv-comp').forEach(function (el) {
      el.classList.toggle('selected', el.getAttribute('data-id') === id);
    });
    renderRight();
  }

  /* ================= 右侧面板 ================= */
  function renderRight() {
    var box = document.getElementById('rightPanel');
    var c = state.selId ? findComp(state.selId) : null;
    if (!c) { box.innerHTML = pageSettingsHTML(); }
    else {
      var tabs = [['style', '样式'], ['data', '数据'], ['event', '事件']];
      box.innerHTML = '<div class="tabs">' + tabs.map(function (t) {
        return '<button class="tab' + (state.rightTab === t[0] ? ' active' : '') + '" data-rtab="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>' + rightTabHTML(c);
    }
    mountIcons(box);
    bindRight(c);
  }

  function pageSettingsHTML() {
    return '' +
      '<div class="p-sec"><h4><i data-icon="monitor" data-size="13"></i>大屏信息</h4>' +
      '<div class="f-row"><span class="f-label">大屏名称</span><div class="f-ctrl"><input class="input-sm input" value="水务总览驾驶舱"></div></div>' +
      '<div class="f-row"><span class="f-label">分辨率</span><div class="f-ctrl"><select class="select"><option>1920 × 1080</option><option>2560 × 1440</option><option>3840 × 2160</option></select></div></div></div>' +
      '<div class="p-sec"><h4><i data-icon="image" data-size="13"></i>背景设置</h4>' +
      '<div class="f-row"><span class="f-label">填充方式</span><div class="f-ctrl"><select class="select"><option value="cover">覆盖 cover</option><option value="contain">包含 contain</option><option value="stretch">拉伸 stretch</option><option value="repeat">平铺 repeat</option><option value="center">居中 center</option></select></div></div>' +
      '<div class="f-row"><span class="f-label">背景颜色</span><div class="f-ctrl"><span class="color-dot" style="background:#0D1730"></span><input class="input-sm input" value="#0D1730" style="width:90px"></div></div>' +
      '<div class="f-row"><span class="f-label">背景图片</span><div class="f-ctrl"><button class="btn btn-sm" id="bgUpload"><i data-icon="upload" data-size="13"></i>上传图片</button></div></div></div>' +

  /* ================= 画布交互：选中 / 拖动 / 缩放 ================= */
  var drag = null;
  canvasEl.addEventListener('mousedown', function (e) {
    var el = e.target.closest('.cv-comp');
    if (!el) { select(null); return; }
    var id = el.getAttribute('data-id');
    select(id);
    var c = findComp(id);
    var isResize = !!e.target.closest('.cv-handle.br');
    drag = { id: id, mode: isResize ? 'resize' : 'move', sx: e.clientX, sy: e.clientY, ox: c.x, oy: c.y, ow: c.w, oh: c.h, el: el, moved: false };
    e.preventDefault();
  });

  document.addEventListener('mousemove', function (e) {
    if (!drag) return;
    var dx = (e.clientX - drag.sx) / state.zoom, dy = (e.clientY - drag.sy) / state.zoom;
    if (Math.abs(dx) + Math.abs(dy) > 1) drag.moved = true;
    var c = findComp(drag.id);
    if (drag.mode === 'move') {
      c.x = Math.round(Math.min(Math.max(drag.ox + dx, 0), 1920 - c.w));
      c.y = Math.round(Math.min(Math.max(drag.oy + dy, 0), 1080 - c.h));
      drag.el.style.left = c.x + 'px'; drag.el.style.top = c.y + 'px';
    } else {
      c.w = Math.round(Math.max(drag.ow + dx, 60));
      c.h = Math.round(Math.max(drag.oh + dy, 40));
      drag.el.style.width = c.w + 'px'; drag.el.style.height = c.h + 'px';
    }
  });

  document.addEventListener('mouseup', function () {
    if (!drag) return;
    if (drag.moved) { markDirty(); renderCanvas(); if (state.selId === drag.id) renderRight(); }
    drag = null;
  });

  function aiAppend(role, text) {
    var box = document.getElementById('aiMsgs');

    div.textContent = text;

    box.scrollTop = box.scrollHeight;
    return div;
  }
  function aiAsk(q) {

    aiAppend('me', q);

      loading.textContent = res.data.answer;
      document.getElementById('aiMsgs').scrollTop = 1e6;
    });
